name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund 2>&1
          echo "--- checking @testing-library/dom ---"
          ls -la node_modules/@testing-library/ || true
          npm ls @testing-library/dom 2>&1 || true
          npm install @testing-library/dom@10 --save-dev --no-audit --no-fund 2>&1 || true
          ls -la node_modules/@testing-library/ || true
      - run: npm run test:unit
