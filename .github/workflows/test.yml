name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Debug deps
        run: |
          ls node_modules/@testing-library/ || echo "no @testing-library dir"
          ls node_modules/@testing-library/dom/package.json || echo "no dom package"
      - run: npm run test:unit
