name: Update Cloudflare DNS to Load Balancers

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: self-hosted
    steps:
      - name: Update DNS records to point to load balancers
        env:
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          ZONE_ID: "61e67a92edc36ac6390da0e3efa81fcd"
          NLB_IP: "144.21.35.198"
          FLB_IP: "84.235.168.140"
        run: |
          set -e

          update_record() {
            local name=$1
            local ip=$2
            local proxied=$3

            echo "Updating $name -> $ip (proxied=$proxied)"

            # Get record ID
            RECORD_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$name" \
              -H "X-Auth-Key: $CF_KEY" \
              -H "X-Auth-Email: $CF_EMAIL" | jq -r '.result[0].id')

            if [ "$RECORD_ID" = "null" ] || [ -z "$RECORD_ID" ]; then
              echo "  Creating new A record"
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "X-Auth-Key: $CF_KEY" \
                -H "X-Auth-Email: $CF_EMAIL" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$name\",\"content\":\"$ip\",\"proxied\":$proxied,\"ttl\":1}" | jq '.success'
            else
              echo "  Updating record $RECORD_ID"
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                -H "X-Auth-Key: $CF_KEY" \
                -H "X-Auth-Email: $CF_EMAIL" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"A\",\"name\":\"$name\",\"content\":\"$ip\",\"proxied\":$proxied,\"ttl\":1}" | jq '.success'
            fi
          }

          # Main traffic through NLB (unlimited bandwidth)
          update_record "3aka.com" "$NLB_IP" true
          update_record "api.3aka.com" "$NLB_IP" true

          # WebSocket gateway through FLB (10 Mbps, lower bandwidth ok for WS)
          update_record "gw.3aka.com" "$FLB_IP" true

          # S3 stays on Micro 1 (separate server)
          # s3.3aka.com - no change needed

          echo ""
          echo "DNS update complete. Verify with: dig +short 3aka.com api.3aka.com gw.3aka.com"
