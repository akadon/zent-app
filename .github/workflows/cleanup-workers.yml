name: Remove Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove 3aka.com from CF Pages and purge cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=3aka.com" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id')
          echo "Zone: $ZONE_ID"

          # Remove custom domain 3aka.com from Pages project
          echo "=== Removing 3aka.com from Pages project ==="
          curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/zent-app/domains/3aka.com" \
            -H "Authorization: Bearer $CF_TOKEN" | jq .

          # Delete the Pages project entirely
          echo "=== Deleting Pages project zent-app ==="
          curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/zent-app" \
            -H "Authorization: Bearer $CF_TOKEN" | jq .

          # Verify it's gone
          echo "=== Remaining Pages projects ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" | jq '.result[] | {name, domains}'

          # Try cache purge
          echo "=== Purging cache ==="
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | jq .

          echo "Done!"
