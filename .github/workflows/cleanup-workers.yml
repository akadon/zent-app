name: Remove Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workers app and purge cache
        run: |
          # Delete the worker
          echo "Deleting worker..."
          curl -sf -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zent-app" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq . || echo "Worker may already be deleted"

          # Get zone ID for 3aka.com
          echo "Finding zone..."
          ZONE_ID=$(curl -sf \
            "https://api.cloudflare.com/client/v4/zones?name=3aka.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"

          if [ "$ZONE_ID" != "null" ] && [ -n "$ZONE_ID" ]; then
            # Delete Workers routes for this zone
            echo "Listing Workers routes..."
            ROUTES=$(curl -sf \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[].id')
            for ROUTE_ID in $ROUTES; do
              echo "Deleting route $ROUTE_ID..."
              curl -sf -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq .
            done

            # Purge entire cache
            echo "Purging cache..."
            curl -sf -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' | jq .
          fi

          echo "Done!"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
