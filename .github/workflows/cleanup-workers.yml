name: Fix DNS Records

on:
  workflow_dispatch:

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Update DNS to point to origin
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=3aka.com" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id')
          echo "Zone: $ZONE_ID"

          # List ALL DNS records
          echo "=== All DNS records ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" | jq '.result[] | {id, name, type, content, proxied}'

          # Find the record for 3aka.com (root)
          echo "=== Root record ==="
          ROOT_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=3aka.com&type=CNAME" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id')
          echo "Root CNAME record ID: $ROOT_ID"

          if [ "$ROOT_ID" != "null" ] && [ -n "$ROOT_ID" ]; then
            # Delete the old CNAME record
            echo "Deleting old CNAME..."
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ROOT_ID" \
              -H "Authorization: Bearer $CF_TOKEN" | jq .
          fi

          # Also check for A record
          A_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=3aka.com&type=A" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id')
          echo "Root A record ID: $A_ID"

          if [ "$A_ID" != "null" ] && [ -n "$A_ID" ]; then
            echo "Updating existing A record..."
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$A_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"content":"193.123.36.192","proxied":true}' | jq .
          else
            # Create A record pointing to A1
            echo "Creating A record for 3aka.com -> 193.123.36.192..."
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"A","name":"3aka.com","content":"193.123.36.192","proxied":true,"ttl":1}' | jq .
          fi

          # Verify
          echo "=== Updated records ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=3aka.com" \
            -H "Authorization: Bearer $CF_TOKEN" | jq '.result[] | {name, type, content, proxied}'

          echo "Done!"
