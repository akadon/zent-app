name: Purge Cloudflare Cache

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Check CF bindings and purge
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=3aka.com" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id')
          echo "Zone: $ZONE_ID"

          # Check for Workers scripts
          echo "=== Workers scripts ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" \
            -H "Authorization: Bearer $CF_TOKEN" | jq '.result[] | {id, created_on}'

          # Check for Pages projects
          echo "=== Pages projects ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" | jq '.result[] | {name, subdomain, domains}'

          # Check Workers domains (custom domains)
          echo "=== Workers custom domains ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains" \
            -H "Authorization: Bearer $CF_TOKEN" | jq .

          # Try to list token permissions
          echo "=== Token verify ==="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN" | jq .
