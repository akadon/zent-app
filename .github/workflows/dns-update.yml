name: Update Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      record_name:
        description: 'DNS record name (e.g. gw.3aka.com)'
        required: true
      record_content:
        description: 'IP address to point to'
        required: true
      record_type:
        description: 'DNS record type'
        required: false
        default: 'A'
      proxied:
        description: 'Cloudflare proxy enabled'
        required: false
        default: 'true'

jobs:
  update-dns:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Get Zone ID
        id: zone
        run: |
          ZONE_ID=$(curl -sf "https://api.cloudflare.com/client/v4/zones?name=${{ vars.CF_ZONE_NAME }}" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}" \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" | jq -r '.result[0].id')
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "Zone ID: $ZONE_ID"

      - name: Create or update DNS record
        run: |
          ZONE_ID="${{ steps.zone.outputs.zone_id }}"
          AUTH_KEY="${{ secrets.CLOUDFLARE_GLOBAL_KEY }}"
          AUTH_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          NAME="${{ inputs.record_name }}"
          CONTENT="${{ inputs.record_content }}"
          TYPE="${{ inputs.record_type }}"
          PROXIED=${{ inputs.proxied }}

          # Check if record exists
          EXISTING=$(curl -sf "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$NAME&type=$TYPE" \
            -H "X-Auth-Key: $AUTH_KEY" -H "X-Auth-Email: $AUTH_EMAIL")
          RECORD_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')
          OLD_IP=$(echo "$EXISTING" | jq -r '.result[0].content // "none"')

          PAYLOAD=$(jq -n --arg type "$TYPE" --arg name "$NAME" --arg content "$CONTENT" --argjson proxied "$PROXIED" \
            '{type: $type, name: $name, content: $content, proxied: $proxied, ttl: 1}')

          if [ -n "$RECORD_ID" ]; then
            echo "Updating: $NAME ($OLD_IP -> $CONTENT)"
            RESULT=$(curl -sf -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
              -H "X-Auth-Key: $AUTH_KEY" -H "X-Auth-Email: $AUTH_EMAIL" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
          else
            echo "Creating: $NAME -> $CONTENT"
            RESULT=$(curl -sf -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "X-Auth-Key: $AUTH_KEY" -H "X-Auth-Email: $AUTH_EMAIL" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
          fi

          SUCCESS=$(echo "$RESULT" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then
            echo "Done: $NAME -> $CONTENT (proxied: $PROXIED)"
          else
            echo "Failed: $RESULT"
            exit 1
          fi
