name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_WS_URL: ${{ vars.WS_URL }}
          VITE_CDN_URL: ${{ vars.CDN_URL }}

      - name: Package for deploy
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package.json package-lock.json deploy/
          cd deploy && npm install --omit=dev --no-audit --no-fund && npm install vinext --no-audit --no-fund

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no -p 2222 ubuntu@${{ secrets.DEPLOY_HOST }} '
            rm -rf /opt/zent-app/*
          '
          scp -o StrictHostKeyChecking=no -P 2222 -r deploy/* ubuntu@${{ secrets.DEPLOY_HOST }}:/opt/zent-app/
          ssh -o StrictHostKeyChecking=no -p 2222 ubuntu@${{ secrets.DEPLOY_HOST }} '
            sudo systemctl restart zent-app
          '

      - name: Purge Cloudflare cache
        if: vars.CF_ZONE_NAME != ''
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${{ vars.CF_ZONE_NAME }}" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}" \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" | jq -r '.result[0].id')
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}" \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'
