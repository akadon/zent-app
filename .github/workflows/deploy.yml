name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install 2>&1 | tee /tmp/install.log || (cat /tmp/install.log >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Build and deploy
        run: npx vinext deploy 2>&1 | tee /tmp/deploy.log || (cat /tmp/deploy.log >> $GITHUB_STEP_SUMMARY && exit 1)
        env:
          VITE_API_URL: https://api.3aka.com/api
          VITE_WS_URL: wss://api.3aka.com
          VITE_CDN_URL: https://api.3aka.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
