appId: com.zent.desktop
productName: Zent
directories:
  output: dist-electron
files:
  - electron/**/*.js
  - "!node_modules"
extraResources:
  - from: .next/standalone
    to: standalone
  - from: public/icon.png
    to: icon.png
win:
  target: nsis
  icon: public/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/icon.png
mac:
  target: dmg
  icon: public/icon.png
  category: public.app-category.social-networking
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target: AppImage
  icon: public/icon.png
  category: Network
